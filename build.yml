name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install -g cordova
      - name: تجهيز فولدر www وتحميل Three.js
        run: |
          mkdir -p www
          cp index.html www/index.html
          curl -L -o www/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
      - run: cordova platform add android@13
      - run: cordova build android --debug
      - uses: actions/upload-artifact@v4
        with:
          name: KartMasria-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
